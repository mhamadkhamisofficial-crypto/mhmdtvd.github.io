<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>mhmd</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      z-index: 10;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
      padding: 50px 20px;
      animation: appear 1.5s ease;
    }

    .name {
      font-size: 17px;
      letter-spacing: 8px;
      text-transform: lowercase;
      margin-bottom: 70px;
      color: #ffffff;
    }

    .time {
      font-family: Georgia, serif;
      font-size: 48px;
      letter-spacing: 5px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 55px;
    }

    .line {
      width: 100%;
      height: 1px;
      background: #292929;
      margin-bottom: 45px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section a {
      display: block;
      text-decoration: none;
      color: #eeeeee;
      border: 1px solid #292929;
      padding: 19px 20px;
      transition: 0.35s ease;
      letter-spacing: 3px;
      font-size: 13px;
      text-transform: uppercase;
    }

    .section a:hover {
      background: #f2f2f2;
      color: #080808;
      border-color: #f2f2f2;
      transform: translateY(-3px);
    }

    .small {
      color: #555;
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 9px;
      text-transform: uppercase;
    }

    .quote {
      margin-top: 65px;
      color: #555;
      font-family: Georgia, serif;
      font-size: 13px;
      line-height: 1.8;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="name">mhmd</div>

    <div class="time" id="time">00:00</div>

    <div class="subtitle">
      somewhere between dreams and reality
    </div>

    <div class="line"></div>

    <div class="section">
      <a href="https://instagram.com/" target="_blank">
        Instagram
      </a>
      <div class="small">social</div>
    </div>

    <div class="section">
      <a href="https://letterboxd.com/" target="_blank">
        Letterboxd
      </a>
      <div class="small">movies</div>
    </div>

    <div class="section">
      <a href="https://github.com/" target="_blank">
        GitHub
      </a>
      <div class="small">projects</div>
    </div>

    <div class="quote">
      somewhere between dreams and reality.
    </div>

  </div>

  <script>
    function updateTime() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");

      document.getElementById("time").textContent =
        hours + ":" + minutes;
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>

</body>
</html>
