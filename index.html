      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;

      margin-bottom: 55px;
    }

      background: #292929;
      margin-bottom: 45px;
    }

    .section {
      margin-bottom: 28px;
    }

      transition: 0.35s ease;
      letter-spacing: 3px;
      font-size: 13px;
      text-transform: uppercase;
    }

      background: #f2f2f2;
      color: #080808;
      border-color: #f2f2f2;
      transform: translateY(-3px);
    }

      color: #555;
      font-size: 10px;
      letter-spacing: 3px;
      margin-top: 9px;
      text-transform: uppercase;
    }
